<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-policy-lens Report</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6; --text:#1b1f24; --muted:#5b6470; --line:#e2e6eb;
  --accent:#3b5bdb; --accent-soft:#e8edff;
  --crit:#c92a2a; --crit-soft:#fdecec; --high:#d9480f; --high-soft:#fff0e6;
  --med:#b7791f; --med-soft:#fff7e0; --low:#1971c2; --low-soft:#e7f2fd;
  --info:#5f6b7a; --info-soft:#eef1f4; --ok:#2b8a3e; --ok-soft:#e8f6ec; --na:#868e96;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --panel:#171b21; --panel-2:#1e232b; --text:#e6e9ee; --muted:#9aa4b2; --line:#2a3039;
    --accent:#8ea2ff; --accent-soft:#1f2747;
    --crit:#ff8787; --crit-soft:#3a1d1f; --high:#ffa94d; --high-soft:#3a2716;
    --med:#ffd43b; --med-soft:#332b12; --low:#74c0fc; --low-soft:#13293d;
    --info:#adb5bd; --info-soft:#22272e; --ok:#69db7c; --ok-soft:#14301c; --na:#6c757d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#171b21; --panel-2:#1e232b; --text:#e6e9ee; --muted:#9aa4b2; --line:#2a3039;
  --accent:#8ea2ff; --accent-soft:#1f2747;
  --crit:#ff8787; --crit-soft:#3a1d1f; --high:#ffa94d; --high-soft:#3a2716;
  --med:#ffd43b; --med-soft:#332b12; --low:#74c0fc; --low-soft:#13293d;
  --info:#adb5bd; --info-soft:#22272e; --ok:#69db7c; --ok-soft:#14301c; --na:#6c757d;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI","Noto Sans KR",sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:.86em}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted);margin-left:6px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.sample{border-color:var(--med);color:var(--med);background:var(--med-soft)}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.jump{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.jump a{padding:6px 10px;border-radius:8px;color:var(--muted);font-size:13px;white-space:nowrap}
nav.jump a:hover{background:var(--panel-2);text-decoration:none;color:var(--text)}
section{margin:28px 0}
h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

.hero{display:grid;grid-template-columns:1.25fr 2fr;gap:16px;margin-top:20px}
.verdict{padding:20px;display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--crit)}
.verdict .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.verdict .big{font-size:26px;font-weight:750;line-height:1.25;letter-spacing:-.02em}
.verdict p{margin:0;color:var(--muted);font-size:14px}
.exit{font-family:var(--mono);font-size:12px;color:var(--crit)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;border-top:4px solid var(--line);text-align:left}
.stat:hover{border-color:var(--accent)}
.stat .n{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .t{font-size:13px;font-weight:600}
.stat .d{font-size:12px;color:var(--muted)}
.stat.fix{border-top-color:var(--crit)} .stat.fix .n{color:var(--crit)}
.stat.review{border-top-color:var(--med)} .stat.review .n{color:var(--med)}
.stat.good{border-top-color:var(--ok)} .stat.good .n{color:var(--ok)}
.stat.na{border-top-color:var(--na)} .stat.na .n{color:var(--na)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--panel-2);margin-top:4px}
.bar span{display:block;height:100%}

.layers{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.layer{padding:12px;position:relative}
.layer .rank{position:absolute;top:10px;right:12px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.layer .nm{font-weight:650;font-size:14px}
.layer .path{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all;margin:4px 0 8px}
.layer .st{font-size:12px;display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.st.on .dot{background:var(--ok)} .st.off .dot{background:var(--na)} .st.unk .dot{background:var(--med)}
.layer.off{opacity:.7}

.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{padding:0;overflow:hidden}
.col>header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.col>header h3{margin:0;font-size:15px}
.col>header .cnt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.col.fix>header{background:var(--crit-soft)} .col.fix .cnt{color:var(--crit)}
.col.review>header{background:var(--med-soft)} .col.review .cnt{color:var(--med)}
.col.good>header{background:var(--ok-soft)} .col.good .cnt{color:var(--ok)}
.col .hint{font-size:12px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line)}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px}
.item:last-child{border-bottom:0}
.item:hover{background:var(--panel-2)}
.item .row1{display:flex;gap:8px;align-items:baseline}
.item .id{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none}
.item .ttl{font-weight:600;font-size:14px}
.item .why{font-size:13px;color:var(--muted);margin:4px 0 6px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.tag.inc{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.tag.off{border-color:var(--low);color:var(--low);background:var(--low-soft)}
.tag.exp{border-color:var(--med);color:var(--med)}
.tag.lv{font-family:var(--mono)}
.sev{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;text-transform:uppercase;letter-spacing:.03em;flex:none}
.sev.critical{background:var(--crit-soft);color:var(--crit)} .sev.high{background:var(--high-soft);color:var(--high)}
.sev.medium{background:var(--med-soft);color:var(--med)} .sev.low{background:var(--low-soft);color:var(--low)}
.sev.info{background:var(--info-soft);color:var(--info)} .sev.pass{background:var(--ok-soft);color:var(--ok)}
.sev.na{background:var(--info-soft);color:var(--na)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#0f1216}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0f1216}}
.tab .mini{font-size:11px;opacity:.85}
.domain{padding:18px}
.domain .lead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.domain .lead h3{margin:0 0 4px;font-size:16px}
.domain .lead p{margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.domain .rulechips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.rc{font-size:12px;border-radius:8px;padding:3px 8px;border:1px solid var(--line);background:var(--panel-2);display:inline-flex;gap:6px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.k code{font-weight:600}
.val{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border-radius:6px;padding:2px 6px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.val.unset{background:none;color:var(--muted);font-style:italic;font-family:inherit;padding:0}
.src{font-size:12px;white-space:nowrap}
.src b{font-weight:600}
.shadow{font-size:12px;color:var(--muted);margin-top:4px}
.meaning{color:var(--muted);font-size:13px;min-width:220px}
.table-scroll{overflow-x:auto}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
details.f{border-bottom:1px solid var(--line)}
details.f:last-of-type{border-bottom:0}
details.f>summary{list-style:none;display:grid;grid-template-columns:auto 84px 1fr auto;gap:10px;align-items:center;padding:12px 16px;cursor:pointer}
details.f>summary::-webkit-details-marker{display:none}
details.f>summary:hover{background:var(--panel-2)}
details.f>summary .chev{transition:transform .15s;color:var(--muted)}
details.f[open]>summary .chev{transform:rotate(90deg)}
details.f .ttl{font-weight:600}
details.f .ttl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.fbody{padding:4px 16px 18px 44px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fbody h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fbody p{margin:0 0 8px;font-size:14px}
.ev{background:var(--panel-2);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.fix-code{background:var(--panel-2);border-left:3px solid var(--ok);border-radius:6px;padding:10px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.basis li{font-size:13.5px;margin-bottom:4px}
.basis ul{margin:0;padding-left:18px}
.empty{padding:24px;text-align:center;color:var(--muted)}

.unk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.unk .card{padding:14px}
.unk h4{margin:0 0 6px;font-size:14px}
.unk p{margin:0 0 8px;font-size:13px;color:var(--muted)}

footer{color:var(--muted);font-size:12.5px;padding:24px 0 48px;border-top:1px solid var(--line);margin-top:36px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .layers{grid-template-columns:repeat(3,1fr)}
  .unk{grid-template-columns:1fr}
  .fbody{grid-template-columns:1fr;padding-left:16px}
}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .layers{grid-template-columns:repeat(2,1fr)}
  details.f>summary{grid-template-columns:auto 1fr auto}
  details.f>summary .sevcell{display:none}
  .meta{display:none}
  th.hide-sm,td.hide-sm{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">cc-policy-lens<small data-i18n="brandSub"></small></div>
    <div class="meta"><span id="m-target"></span><span id="m-time"></span></div>
    <span class="pill sample" data-i18n="sample"></span>
    <div class="spacer"></div>
    <nav class="jump" id="jump"></nav>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="ko">KO</button><button type="button" data-lang="en">EN</button>
    </div>
    <button class="ghost" id="theme" type="button" data-i18n="theme"></button>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <div class="card verdict" id="verdict"></div>
    <div class="stats" id="stats"></div>
  </div>

  <section>
    <h2 data-i18n="layersH"></h2>
    <p class="sub" data-i18n="layersSub"></p>
    <div class="layers" id="layers"></div>
  </section>

  <section id="summary">
    <h2 data-i18n="sumH"></h2>
    <p class="sub" data-i18n="sumSub"></p>
    <div class="cols">
      <div class="card col fix"><header><h3 data-i18n="b_fix"></h3><span class="cnt" id="c-fix"></span></header>
        <div class="hint" data-i18n="hintFix"></div><div id="l-fix"></div></div>
      <div class="card col review"><header><h3 data-i18n="b_review"></h3><span class="cnt" id="c-review"></span></header>
        <div class="hint" data-i18n="hintReview"></div><div id="l-review"></div></div>
      <div class="card col good"><header><h3 data-i18n="b_good"></h3><span class="cnt" id="c-good"></span></header>
        <div class="hint" data-i18n="hintGood"></div><div id="l-good"></div></div>
    </div>
  </section>

  <section id="explore">
    <h2 data-i18n="expH"></h2>
    <p class="sub" data-i18n="expSub"></p>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="card domain" id="domain" role="tabpanel"></div>
  </section>

  <section id="findings">
    <h2 data-i18n="findH"></h2>
    <p class="sub" data-i18n="findSub"></p>
    <div class="filters">
      <input id="q" type="search">
      <div id="fchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
    <div class="card" id="flist"></div>
  </section>

  <section id="unknown">
    <h2 data-i18n="unkH"></h2>
    <p class="sub" data-i18n="unkSub"></p>
    <div class="unk" id="unk"></div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
/* ================================================================
   SAMPLE DATA — 실제 렌더러에서는 Python이 JSON으로 주입한다.
   번역 가능한 값은 {ko, en} 객체. 모든 값은 textContent로만 넣는다.
   ================================================================ */
const SCAN = { target:"~/work/acme-api", time:"2026-11-08 14:32", exitCode:1 };

const UI = {
 ko:{
  brandSub:"설정 보안 리포트", sample:"샘플 데이터 · 시안", theme:"테마",
  nav:[["#summary","요약"],["#explore","설정 둘러보기"],["#findings","모든 점검"],["#unknown","확인 불가"]],
  target:"대상: ",
  verdictLabel:"판정", verdictBig:n=>`반드시 고칠 설정 ${n}개`,
  verdictP:"모든 Bash 명령 허용, 민감 파일 읽기, 버전 고정 안 된 MCP 서버가 핵심입니다. 이 5개를 고치면 critical·high 위반이 0이 됩니다.",
  exit:c=>`exit code ${c} · critical/high 위반이 있어 CI에서 실패로 처리됩니다`,
  stats:{fix:["반드시 수정","critical · high 위반"],review:["검토 필요","medium 이하 · 조직 통제"],good:["잘된 설정","룰 통과"],na:["해당 없음","대상 파일 없음"]},
  layersH:"어떤 설정 파일을 읽었나",
  layersSub:"같은 키가 여러 곳에 있으면 왼쪽(우선순위 높음)이 이깁니다. 단, permissions.allow/deny 같은 목록은 모든 계층이 합쳐집니다.",
  layerSt:{on:"적용됨",off:"없음",unk:"확인 불가"},
  sumH:"요약",
  sumSub:"24개 룰을 근거(실제 사고 › 공식 문서 › 위협 프레임워크 › 전문가 판단) 순서로 판정했습니다. 항목을 누르면 상세 근거와 고치는 방법으로 이동합니다.",
  b_fix:"반드시 수정", b_review:"검토 필요", b_good:"잘된 설정",
  hintFix:"critical·high 위반. 이것부터 고치세요.",
  hintReview:"의도한 설정인지 확인하세요. 개인 PC라면 그대로 둬도 되는 항목이 있습니다.",
  hintGood:"이미 안전하게 설정되어 있습니다. 유지하세요.",
  expH:"설정 둘러보기",
  expSub:"영역별로 최종 적용값, 어느 파일에서 왔는지, 덮어써진 값, 그리고 그 설정이 실제로 뜻하는 바를 보여줍니다.",
  th:["설정","최종 값","출처","무슨 뜻인가"], unset:"설정 안 됨", shadowed:"덮어써진 값: ",
  tabFix:n=>`수정 ${n}`, tabReview:n=>`검토 ${n}`,
  findH:"모든 점검 결과", findSub:"판정 조건, 발견 내용(시크릿은 마스킹), 출처 파일, 근거, 조치 방법.",
  search:"ID, 제목, 설정 키로 검색",
  filters:{all:"전체",fix:"반드시 수정",review:"검토 필요",good:"통과",na:"해당 없음",L1:"L1 사고 근거"},
  hCheck:"판정 조건", hEv:"발견 내용", hFix:"고치는 방법", hNow:"현재 상태", hBasis:"근거", srcLbl:"출처: ",
  bDoc:"공식 문서: ", bDocUnv:" (판정 기준은 문서 미확인)", bThreat:"위협: ", bInc:"사고: ",
  bGrade:(b,l,s)=>`근거 등급: ${b} · ${l} · 룰 심각도 ${s}`,
  noResult:"조건에 맞는 항목이 없습니다.",
  pass:"통과", na:"해당 없음", incTag:"사고 ", unverTag:"키 미확인",
  basis:{incident:"실제 사고",official:"공식 문서",framework:"프레임워크",expert:"전문가 판단"},
  unkH:"파일로는 확인할 수 없는 것",

let lang = "ko";
const L = x => (x && typeof x === "object" && !Array.isArray(x) && ("ko" in x || "en" in x)) ? (x[lang] ?? x.ko) : x;
const T = k => UI[lang][k];
const $ = (s, r=document) => r.querySelector(s);
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return n;
}
const clear = n => { n.textContent = ""; return n; };
const bucket = r => r.st === "pass" ? "good" : r.st === "na" ? "na"
  : (r.sev === "critical" || r.sev === "high") ? "fix" : "review";
const sevOrder = {critical:0,high:1,medium:2,low:3,info:4};
const counts = {fix:0,review:0,good:0,na:0};
RULES.forEach(r => counts[bucket(r)]++);

function sevBadge(r){
  if (r.st === "pass") return el("span",{class:"sev pass",text:T("pass")});
  if (r.st === "na") return el("span",{class:"sev na",text:T("na")});
  return el("span",{class:"sev "+r.sev,text:r.sev});
}
function tags(r){
  const t = [];
  r.inc.forEach(i => t.push(el("span",{class:"tag inc",title:L(INC[i].t),text:T("incTag")+i})));
  if (!r.inc.length) t.push(el("span",{class:"tag "+(r.basis==="expert"?"exp":"off"),text:T("basis")[r.basis]}));
  r.asi.forEach(a => t.push(el("span",{class:"tag",title:ASI[a],text:a})));
  t.push(el("span",{class:"tag lv",text:r.lv}));
  if (r.unverified) t.push(el("span",{class:"tag exp",text:T("unverTag")}));
  return el("div",{class:"tags"},t);
}

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = T(n.dataset.i18n));
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  const nav = clear($("#jump"));
  T("nav").forEach(([h,t]) => nav.append(el("a",{href:h,text:t})));
  $("#m-target").textContent = T("target") + SCAN.target;
  $("#m-time").textContent = SCAN.time;
  $("#q").placeholder = T("search"); $("#q").setAttribute("aria-label", T("search"));
  const f = clear($("#foot"));
  f.append(T("foot1"), el("code",{text:"docs/rules-catalog.json"}), T("foot2"),
    el("a",{href:"https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/",text:"OWASP Top 10 for Agentic Applications 2026"}),
    T("foot3"), el("a",{href:"https://code.claude.com/docs/en/settings",text:"code.claude.com/docs"}),
    el("br"), T("foot4"));
}

function renderHero(){
  const v = clear($("#verdict"));
  v.append(el("div",{class:"label",text:T("verdictLabel")}),
    el("div",{class:"big",text:T("verdictBig")(counts.fix)}),
    el("p",{text:T("verdictP")}),
    el("div",{class:"exit",text:T("exit")(SCAN.exitCode)}));
  const bar = el("div",{class:"bar"});
  [["fix","var(--crit)"],["review","var(--med)"],["good","var(--ok)"],["na","var(--na)"]].forEach(([k,c]) =>
    bar.append(el("span",{style:`width:${counts[k]/RULES.length*100}%;background:${c}`})));
  v.append(bar);
  const s = clear($("#stats"));
  ["fix","review","good","na"].forEach(k => {
    const [t,d] = T("stats")[k];
    s.append(el("button",{class:"card stat "+k,type:"button",onclick:()=>{
      if (k==="na"){ setFilter("na"); location.hash="#findings"; } else location.hash="#summary"; }},
      el("span",{class:"n",text:counts[k]}), el("span",{class:"t",text:t}), el("span",{class:"d",text:d})));
  });
}

function renderLayers(){
  const box = clear($("#layers"));
  LAYERS.forEach((l,i) => box.append(el("div",{class:"card layer "+(l.state==="off"?"off":"")},
    el("span",{class:"rank",text:"#"+(i+1)}),
    el("div",{class:"nm",text:L(l.name)}),
    el("div",{class:"path",text:L(l.path)}),
    el("span",{class:"st "+l.state},el("span",{class:"dot"}),`${T("layerSt")[l.state]} · ${L(l.note)}`))));
}

function goto(id){
  const d = document.getElementById("f-"+id);
  if (!d) return;
  $("#q").value = ""; setFilter("all");
  d.open = true; d.scrollIntoView({behavior:"smooth",block:"center"});
  d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash");
}

function renderSummary(){
  ["fix","review","good"].forEach(b => {
    const list = RULES.filter(r => bucket(r)===b).sort((a,c)=>sevOrder[a.sev]-sevOrder[c.sev] || a.lv.localeCompare(c.lv));
    $("#c-"+b).textContent = list.length;
    const host = clear($("#l-"+b));
    list.forEach(r => host.append(el("button",{class:"item",type:"button",onclick:()=>goto(r.id)},
      el("div",{class:"row1"}, b==="good"?null:sevBadge(r), el("span",{class:"id",text:r.id}), el("span",{class:"ttl",text:L(r.title)})),
      el("div",{class:"why",text:L(r.why)}), tags(r))));
  });
}

let curDom = "perm";
function domainStatus(id){
  const rs = RULES.filter(r=>r.dom===id);
  return {fix:rs.filter(r=>bucket(r)==="fix").length, review:rs.filter(r=>bucket(r)==="review").length, good:rs.filter(r=>bucket(r)==="good").length, rs};
}
function renderTabs(){
  const t = clear($("#tabs"));
  DOMAINS.forEach(d => {
    const s = domainStatus(d.id);
    const dotc = s.fix ? "var(--crit)" : s.review ? "var(--med)" : s.good ? "var(--ok)" : "var(--na)";
    t.append(el("button",{class:"tab",role:"tab",type:"button","aria-selected":String(d.id===curDom),onclick:()=>{curDom=d.id;renderTabs();renderDomain();}},
      el("span",{class:"dot",style:"background:"+dotc}), L(d.name),
      el("span",{class:"mini",text: s.fix? T("tabFix")(s.fix) : s.review? T("tabReview")(s.review) : ""})));
  });
}
function ruleChip(id, style){
  const r = RULES.find(x=>x.id===id);
  return el("button",{class:"rc",type:"button",style,onclick:()=>goto(r.id)},sevBadge(r),el("span",{class:"mono",text:r.id}));
}
function renderDomain(){
  const d = DOMAINS.find(x=>x.id===curDom), s = domainStatus(d.id), box = clear($("#domain"));
  const chips = el("div",{class:"rulechips"}, s.rs.map(r => ruleChip(r.id)));
  box.append(el("div",{class:"lead"}, el("div",{}, el("h3",{text:L(d.name)}), el("p",{text:L(d.lead)})), chips));
  const tb = el("tbody");
  d.keys.forEach(k => {
    const valCell = k.v==null ? el("span",{class:"val unset",text:T("unset")}) : el("span",{class:"val",text:L(k.v)});
    const sh = k.sh.length ? el("div",{class:"shadow"},T("shadowed"), ...k.sh.map(x=>el("span",{}, el("s",{text:x.v})," ("+x.src+") "))) : null;
    tb.append(el("tr",{},
      el("td",{class:"k"},el("code",{text:k.k})),
      el("td",{},valCell,sh),
      el("td",{class:"src hide-sm"}, k.src ? el("b",{text:k.src}) : el("span",{style:"color:var(--muted)",text:"—"})),
      el("td",{class:"meaning"},L(k.m), k.rule ? el("div",{},ruleChip(k.rule,"margin-top:6px")) : null)));
  });
  const th = T("th");
  box.append(el("div",{class:"table-scroll"},el("table",{},
    el("thead",{},el("tr",{},el("th",{text:th[0]}),el("th",{text:th[1]}),el("th",{class:"hide-sm",text:th[2]}),el("th",{text:th[3]}))), tb)));
}

let filt = "all";
function renderChips(){
  const box = clear($("#fchips"));
  Object.entries(T("filters")).forEach(([f,t]) =>
    box.append(el("button",{class:"chip",type:"button","data-f":f,"aria-pressed":String(f===filt),onclick:()=>setFilter(f),text:t})));
}
function setFilter(f){
  filt = f;
  document.querySelectorAll("#fchips .chip").forEach(c=>c.setAttribute("aria-pressed", String(c.dataset.f===f)));
  applyFilter();
}
function renderFindings(){
  const open = new Set([...document.querySelectorAll("details.f[open]")].map(d=>d.id));
  const host = clear($("#flist"));
  const order = {fix:0,review:1,good:2,na:3};
  [...RULES].sort((a,b)=>order[bucket(a)]-order[bucket(b)] || sevOrder[a.sev]-sevOrder[b.sev]).forEach(r => {
    const basisList = el("ul",{},
      el("li",{},T("bDoc"), el("a",{href:r.doc,target:"_blank",rel:"noopener",text:r.doc.replace(D,"")}), r.unverified? T("bDocUnv"):""),
      el("li",{},T("bThreat")+r.asi.map(a=>a+" "+ASI[a]).join(", ")),
      ...r.inc.map(i => el("li",{},T("bInc"), el("a",{href:INC[i].u,target:"_blank",rel:"noopener",text:i}), " — "+L(INC[i].t))),
      el("li",{},T("bGrade")(T("basis")[r.basis], r.lv, r.sev)));
    const search = [r.id, r.title.ko, r.title.en, L(r.check), L(r.ev)].join(" ").toLowerCase();
    host.append(el("details",{class:"f",id:"f-"+r.id,open:open.has("f-"+r.id),"data-b":bucket(r),"data-lv":r.lv,"data-s":search},
      el("summary",{},
        el("span",{class:"chev",text:"›"}),
        el("span",{class:"sevcell"},sevBadge(r)),
        el("span",{class:"ttl"}, el("span",{class:"mono",style:"color:var(--muted);margin-right:8px",text:r.id}), L(r.title), el("small",{text:L(r.why)})),
        el("span",{class:"tag lv",text:r.lv})),
      el("div",{class:"fbody"},
        el("div",{},
          el("h4",{text:T("hCheck")}), el("p",{text:L(r.check)}),
          el("h4",{text:T("hEv")}), el("pre",{class:"ev",text:L(r.ev)}),
          el("p",{style:"font-size:12.5px;color:var(--muted);margin-top:6px",text:T("srcLbl")+r.src})),
        el("div",{},
          el("h4",{text: r.st==="fail" ? T("hFix") : T("hNow")}), el("pre",{class:"fix-code",text: r.st==="fail" ? L(r.fix) : L(r.why)}),
          el("h4",{style:"margin-top:14px",text:T("hBasis")}), el("div",{class:"basis"},basisList)))));
  });
  host.append(el("div",{class:"empty",id:"noresult",hidden:true,text:T("noResult")}));
  applyFilter();
}
function applyFilter(){
  const q = $("#q").value.trim().toLowerCase(); let shown = 0;
  document.querySelectorAll("details.f").forEach(d => {
    const okF = filt==="all" || d.dataset.b===filt || (filt==="L1" && d.dataset.lv==="L1");
    const ok = okF && (!q || d.dataset.s.includes(q));
    d.hidden = !ok; if (ok) shown++;
  });
  const nr = $("#noresult"); if (nr) nr.hidden = shown>0;
}
$("#q").addEventListener("input", applyFilter);

function renderUnknown(){
  const box = clear($("#unk"));
  UNKNOWN.forEach(u => box.append(el("div",{class:"card"}, el("h4",{text:L(u.t)}), el("p",{text:L(u.p)}), el("code",{text:L(u.how)}))));
}

function renderAll(){
  renderStatic(); renderHero(); renderLayers(); renderSummary();
  renderTabs(); renderDomain(); renderChips(); renderFindings(); renderUnknown();
}

/* language */
(function initLang(){
  const KEY = "ccpl-lang";
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  const fromUrl = new URLSearchParams(location.search).get("lang");
  lang = [fromUrl, saved].find(x => x==="ko"||x==="en") || ((navigator.language||"").toLowerCase().startsWith("ko") ? "ko" : "en");
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch(e){}
    renderAll();
  }));
  renderAll();
})();

/* theme */
(function theme(){
  const root = document.documentElement, KEY = "ccpl-theme";
  try { const s = localStorage.getItem(KEY); if (s) root.dataset.theme = s; } catch(e){}
  $("#theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem(KEY, root.dataset.theme); } catch(e){}
  });
})();
</script>
